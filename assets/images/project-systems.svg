<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sysBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#sysBg)" />
  
  <!-- Grid Matrix Background -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- Network Interconnect Lines -->
  <line x1="400" y1="160" x2="220" y2="340" stroke="#06b6d4" stroke-width="3" stroke-dasharray="8 6" opacity="0.8" />
  <line x1="400" y1="160" x2="580" y2="340" stroke="#06b6d4" stroke-width="3" stroke-dasharray="8 6" opacity="0.8" />
  <line x1="220" y1="340" x2="580" y2="340" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6 6" opacity="0.6" />

  <!-- Central Leader Node -->
  <g transform="translate(400, 160)" filter="url(#glow)">
    <circle r="65" fill="#0c4a6e" stroke="#38bdf8" stroke-width="4" />
    <circle r="48" fill="#082f49" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4 4" />
    <polygon points="0,-25 22,15 -22,15" fill="#38bdf8" opacity="0.9" />
    <text x="0" y="32" fill="#e0f2fe" font-family="system-ui, monospace" font-size="12" font-weight="bold" text-anchor="middle">RAFT LEADER</text>
  </g>

  <!-- Follower Node 1 -->
  <g transform="translate(220, 340)">
    <circle r="50" fill="#0f172a" stroke="#10b981" stroke-width="3" />
    <circle r="36" fill="#064e3b" opacity="0.5" />
    <text x="0" y="5" fill="#a7f3d0" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">NODE-02</text>
    <text x="0" y="24" fill="#34d399" font-family="monospace" font-size="10" text-anchor="middle">REPLICATED</text>
  </g>

  <!-- Follower Node 2 -->
  <g transform="translate(580, 340)">
    <circle r="50" fill="#0f172a" stroke="#8b5cf6" stroke-width="3" />
    <circle r="36" fill="#4c1d95" opacity="0.5" />
    <text x="0" y="5" fill="#ddd6fe" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">NODE-03</text>
    <text x="0" y="24" fill="#a78bfa" font-family="monospace" font-size="10" text-anchor="middle">IN-SYNC</text>
  </g>

  <!-- Status HUD / Badges -->
  <rect x="50" y="40" width="170" height="40" rx="8" fill="#1e293b" stroke="#334155" />
  <circle cx="70" cy="60" r="5" fill="#10b981" />
  <text x="85" y="65" fill="#e2e8f0" font-family="monospace" font-size="12">STATUS: CONSISTENT</text>

  <rect x="580" y="40" width="170" height="40" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="665" y="65" fill="#38bdf8" font-family="monospace" font-size="12" text-anchor="middle">18,400 OPS/SEC</text>

  <path d="M 330 430 L 470 430" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <text x="400" y="460" fill="#94a3b8" font-family="monospace" font-size="13" text-anchor="middle">gRPC Bidirectional Event Bus • Go v1.22</text>
</svg>
