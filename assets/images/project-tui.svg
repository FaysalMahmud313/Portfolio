    <text x="560" y="200" fill="#94a3b8">0</text>
    <text x="640" y="200" fill="#94a3b8">14d</text>

    <text x="70" y="235" fill="#cbd5e1">production</text>
    <text x="200" y="235" fill="#38bdf8">payment-gateway-6c4d-km21</text>
