<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="dbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2b" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#dbBg)" />

  <!-- Frame Header -->
  <rect x="50" y="35" width="700" height="430" rx="14" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
  <line x1="50" y1="88" x2="750" y2="88" stroke="#1e293b" />

  <circle cx="82" cy="62" r="8" fill="#06b6d4" />
  <text x="105" y="67" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">AI DeskBuddy — ESP32-S3 Smart Desk Companion</text>
  <rect x="560" y="50" width="165" height="26" rx="13" fill="#155e75" />
  <text x="642" y="67" fill="#a5f3fc" font-family="monospace" font-size="11" text-anchor="middle">Prototype &amp; Hardware</text>

  <!-- Physical Desk Companion Robot Enclosure -->
  <rect x="90" y="125" width="280" height="300" rx="28" fill="#1e293b" stroke="#334155" stroke-width="3" />
  
  <!-- Cute Animated OLED Screen -->
  <rect x="120" y="160" width="220" height="130" rx="14" fill="#000000" stroke="#0891b2" stroke-width="2" />
  
  <!-- Expressive OLED Cyan Eyes (Happy / Inquisitive) -->
  <ellipse cx="175" cy="225" rx="25" ry="32" fill="#06b6d4" />
  <ellipse cx="285" cy="225" rx="25" ry="32" fill="#06b6d4" />
  <circle cx="185" cy="215" r="9" fill="#ffffff" />
  <circle cx="295" cy="215" r="9" fill="#ffffff" />
  <!-- Small smile line -->
  <path d="M 215 255 Q 230 268 245 255" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />

  <!-- Touch & Motion Sensors on Body -->
  <circle cx="230" cy="330" r="14" fill="#0e7490" />
  <text x="230" y="334" fill="#fff" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">⚡ Touch</text>
  <rect x="150" y="370" width="160" height="28" rx="6" fill="#0f172a" />
  <text x="230" y="388" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">PIR Motion Active</text>

  <!-- Right: Feature Breakdown & Planned Roadmap -->
  <rect x="390" y="125" width="335" height="300" rx="12" fill="#090d16" stroke="#1e293b" />
  <text x="415" y="155" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">CURRENT IMPLEMENTATION</text>

  <rect x="415" y="170" width="285" height="40" rx="6" fill="#1e293b" />
  <text x="430" y="195" fill="#34d399" font-family="monospace" font-size="11">✓ Animated OLED Eye Expressions</text>

  <rect x="415" y="218" width="285" height="40" rx="6" fill="#1e293b" />
  <text x="430" y="243" fill="#34d399" font-family="monospace" font-size="11">✓ Touch &amp; PIR Motion Trigger Loop</text>

  <rect x="415" y="266" width="285" height="40" rx="6" fill="#1e293b" />
  <text x="430" y="291" fill="#34d399" font-family="monospace" font-size="11">✓ Local Webpage Configuration</text>

  <line x1="415" y1="320" x2="700" y2="320" stroke="#334155" />
  <text x="415" y="345" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="bold">PLANNED EXTENSIONS</text>
