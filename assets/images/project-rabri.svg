<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="raBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190d24" />
      <stop offset="60%" stop-color="#2a143d" />
      <stop offset="100%" stop-color="#0e0716" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#raBg)" />

  <!-- Frame Header -->
  <rect x="50" y="35" width="700" height="430" rx="12" fill="#130b1c" stroke="#9333ea" stroke-width="1.5" />
  <line x1="50" y1="88" x2="750" y2="88" stroke="#2e1065" />

  <circle cx="82" cy="62" r="8" fill="#c084fc" />
  <text x="105" y="67" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">RA-BRI — Rheumatoid Arthritis Risk Prediction</text>
  <rect x="540" y="50" width="185" height="26" rx="13" fill="#3b0764" />
  <text x="632" y="67" fill="#d8b4fe" font-family="monospace" font-size="11" text-anchor="middle">NHANES (2011–2020) N=13,273</text>

  <!-- Left Stats Block -->
  <rect x="80" y="110" width="270" height="150" rx="10" fill="#200d30" stroke="#7e22ce" />
  <text x="100" y="138" fill="#d8b4fe" font-family="monospace" font-size="11" font-weight="bold">DATASET &amp; EVALUATION</text>
  <text x="100" y="172" fill="#ffffff" font-family="system-ui, sans-serif" font-size="26" font-weight="bold">13,273 Cohort</text>
  <text x="100" y="196" fill="#a855f7" font-family="monospace" font-size="11">Leakage-Aware Model Evaluation</text>
  <line x1="100" y1="212" x2="330" y2="212" stroke="#3b0764" />
  <text x="100" y="235" fill="#34d399" font-family="monospace" font-size="11">Cross-Validation Guaranteed Clean</text>

  <!-- Right SHAP Visualizer -->
  <rect x="375" y="110" width="345" height="325" rx="10" fill="#1b0c2a" stroke="#4c1d95" />
  <text x="400" y="138" fill="#c084fc" font-family="monospace" font-size="11" font-weight="bold">SHAP FEATURE IMPORTANCE (BEESWARM PLOT)</text>

  <!-- SHAP Feature 1 -->
  <text x="400" y="172" fill="#e2e8f0" font-family="monospace" font-size="11">Age Index</text>
  <line x1="480" y1="168" x2="680" y2="168" stroke="#3b0764" stroke-width="2" />
  <circle cx="560" cy="168" r="7" fill="#ef4444" />
  <circle cx="620" cy="168" r="6" fill="#ef4444" opacity="0.8" />
  <circle cx="520" cy="168" r="5" fill="#3b82f6" />

  <!-- SHAP Feature 2 -->
  <text x="400" y="217" fill="#e2e8f0" font-family="monospace" font-size="11">CRP Serum</text>
  <line x1="480" y1="213" x2="680" y2="213" stroke="#3b0764" stroke-width="2" />
  <circle cx="610" cy="213" r="8" fill="#ef4444" />
  <circle cx="580" cy="213" r="6" fill="#ef4444" />
  <circle cx="500" cy="213" r="6" fill="#3b82f6" />

  <!-- SHAP Feature 3 -->
  <text x="400" y="262" fill="#e2e8f0" font-family="monospace" font-size="11">BMI Level</text>
  <line x1="480" y1="258" x2="680" y2="258" stroke="#3b0764" stroke-width="2" />
  <circle cx="570" cy="258" r="6" fill="#ef4444" />
  <circle cx="530" cy="258" r="6" fill="#3b82f6" />

  <!-- SHAP Feature 4 -->
  <text x="400" y="307" fill="#e2e8f0" font-family="monospace" font-size="11">Sedentary Min</text>
  <line x1="480" y1="303" x2="680" y2="303" stroke="#3b0764" stroke-width="2" />
  <circle cx="550" cy="303" r="6" fill="#ef4444" />
  <circle cx="510" cy="303" r="6" fill="#3b82f6" />

  <!-- SHAP Feature 5 -->
  <text x="400" y="352" fill="#e2e8f0" font-family="monospace" font-size="11">Smoking History</text>
  <line x1="480" y1="348" x2="680" y2="348" stroke="#3b0764" stroke-width="2" />
  <circle cx="590" cy="348" r="7" fill="#ef4444" />
  <circle cx="495" cy="348" r="5" fill="#3b82f6" />

  <text x="400" y="405" fill="#94a3b8" font-family="monospace" font-size="10">High impact on positive RA risk ➔ (Red: High, Blue: Low)</text>

  <!-- Left Bottom Summary -->
  <rect x="80" y="280" width="270" height="155" rx="10" fill="#200d30" stroke="#7e22ce" />
  <text x="100" y="310" fill="#c084fc" font-family="monospace" font-size="11" font-weight="bold">CLINICAL EXPLAINABILITY</text>
  <text x="100" y="340" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">Decisions backed by global &amp; local TreeSHAP attribution, preventing black-box healthcare diagnostic errors.</text>
</svg>
