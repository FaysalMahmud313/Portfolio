<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="fhBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e1e38" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#fhBg)" />

  <!-- Frame Header -->
  <rect x="50" y="35" width="700" height="430" rx="14" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" />
  <line x1="50" y1="88" x2="750" y2="88" stroke="#1e293b" />

  <circle cx="82" cy="62" r="8" fill="#818cf8" />
  <text x="105" y="67" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">Faysal FileHub — Personal Networked Server</text>
  <rect x="560" y="50" width="165" height="26" rx="13" fill="#312e81" />
  <text x="642" y="67" fill="#c7d2fe" font-family="monospace" font-size="11" text-anchor="middle">Hardware Concept</text>

  <!-- Left: Hardware Topology Mockup -->
  <rect x="80" y="115" width="280" height="315" rx="12" fill="#090d16" stroke="#312e81" />
  <text x="105" y="145" fill="#a5b4fc" font-family="monospace" font-size="11" font-weight="bold">SYSTEM ARCHITECTURE</text>

  <!-- ESP32-S3 Microcontroller Unit -->
  <rect x="105" y="165" width="230" height="60" rx="8" fill="#1e1b4b" stroke="#6366f1" />
  <text x="220" y="195" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">ESP32-S3 Core MCU</text>
  <text x="220" y="212" fill="#818cf8" font-family="monospace" font-size="10" text-anchor="middle">Dual-Core Xtensa LX7 • Wi-Fi / SPI</text>

  <!-- Connective SPI Bus -->
  <line x1="220" y1="225" x2="220" y2="255" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4 4" />

  <!-- W5500 SPI Ethernet Module -->
  <rect x="105" y="255" width="230" height="55" rx="8" fill="#0c4a6e" stroke="#0284c7" />
  <text x="220" y="285" fill="#e0f2fe" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">W5500 Hardwired TCP/IP</text>
  <text x="220" y="300" fill="#7dd3fc" font-family="monospace" font-size="10" text-anchor="middle">10/100 Mbps RJ45 Ethernet</text>

  <!-- Connective SD Bus -->
  <line x1="220" y1="310" x2="220" y2="340" stroke="#10b981" stroke-width="3" stroke-dasharray="4 4" />

  <!-- External MicroSD / Storage -->
  <rect x="105" y="340" width="230" height="55" rx="8" fill="#064e3b" stroke="#059669" />
  <text x="220" y="370" fill="#a7f3d0" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">FAT32 / exFAT Storage Unit</text>
  <text x="220" y="385" fill="#34d399" font-family="monospace" font-size="10" text-anchor="middle">Local High-Capacity File System</text>

  <!-- Right: Web Dashboard & Planned Features -->
  <rect x="380" y="115" width="345" height="315" rx="12" fill="#090d16" stroke="#1e293b" />
  <text x="405" y="145" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">PLANNED SERVER FEATURES</text>

  <rect x="405" y="165" width="295" height="42" rx="6" fill="#1e293b" />
  <text x="420" y="191" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">● Responsive Web Storage Dashboard</text>

  <rect x="405" y="215" width="295" height="42" rx="6" fill="#1e293b" />
  <text x="420" y="241" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">● Multi-User Accounts &amp; Session Auth</text>

  <rect x="405" y="265" width="295" height="42" rx="6" fill="#1e293b" />
  <text x="420" y="291" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">● Role-Based Access Control (RBAC)</text>

  <rect x="405" y="315" width="295" height="42" rx="6" fill="#1e293b" />
  <text x="420" y="341" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">● Storage Quota Limits &amp; Directory Sharing</text>

  <text x="405" y="390" fill="#94a3b8" font-family="monospace" font-size="10">Target: Low-power private LAN file cloud with zero external subscriptions.</text>
</svg>
